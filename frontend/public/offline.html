<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#1F3B2D" />
<title>Offline | Side-Quest Learning</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F5EFE0; color: #1F3B2D; font-family: Georgia, "Times New Roman", serif; padding: 24px; box-sizing: border-box; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 26px; margin: 20px 0 8px; }
  p { font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #4A5D3A; max-width: 340px; margin: 0 auto; }
  button { margin-top: 22px; border: 0; border-radius: 999px; padding: 12px 26px; background: #1F3B2D; color: #F5EFE0; font: 700 14px system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Side-Quest needs the internet to load lessons and save work. Nothing you've already handed in is lost. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
