name: Manually compare Side-Quest Workers AI models
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Which Cloudflare AI model should be tested?"
        type: choice
        required: true
        default: qwen
        options:
          - qwen
          - gemma
          - baseline
          - all-three
      fixture:
        description: "Which synthetic lesson should the actual AI generator teach?"
        type: choice
        required: true
        default: year3-place-value
        options:
          - year3-place-value
          - year7-algebra
          - year4-english
          - year5-science
          - year7-history
          - year5-technologies
          - year4-arts
      pipeline:
        description: "Lesson pipeline: compact (original benchmark default), fast (current production), or split (AI_SPLIT_STAGES trial)"
        type: choice
        required: true
        default: compact
        options:
          - compact
          - fast
          - split
      confirm_charge:
        description: "Type RUN to authorise a small real inference test (possibly billable)"
        required: true
        type: string
permissions:
  contents: read
jobs:
  compare:
    if: ${{ inputs.confirm_charge == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix worker ci
      - name: Select explicitly allowlisted models
        id: choose
        env:
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          case "$INPUT_MODEL" in
            qwen) echo "models=@cf/qwen/qwen3-30b-a3b-fp8" >> "$GITHUB_OUTPUT" ;;
            gemma) echo "models=@cf/google/gemma-4-26b-a4b-it" >> "$GITHUB_OUTPUT" ;;
            baseline) echo "models=@cf/meta/llama-3.3-70b-instruct-fp8-fast" >> "$GITHUB_OUTPUT" ;;
            all-three) echo "models=@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/qwen/qwen3-30b-a3b-fp8,@cf/google/gemma-4-26b-a4b-it" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Select pipeline flags
        id: pipeline
        env:
          INPUT_PIPELINE: ${{ inputs.pipeline }}
        run: |
          case "$INPUT_PIPELINE" in
            compact) echo "compact=true" >> "$GITHUB_OUTPUT"; echo "fast=false" >> "$GITHUB_OUTPUT"; echo "split=false" >> "$GITHUB_OUTPUT" ;;
            fast) echo "compact=false" >> "$GITHUB_OUTPUT"; echo "fast=true" >> "$GITHUB_OUTPUT"; echo "split=false" >> "$GITHUB_OUTPUT" ;;
            split) echo "compact=false" >> "$GITHUB_OUTPUT"; echo "fast=true" >> "$GITHUB_OUTPUT"; echo "split=true" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Show zero-call dry run
        env:
          BENCHMARK_FIXTURE: ${{ inputs.fixture }}
          BENCH_FAST_PIPELINE: ${{ steps.pipeline.outputs.fast }}
          BENCH_SPLIT_STAGES: ${{ steps.pipeline.outputs.split }}
        run: node --import ./worker/test/register.mjs worker/scripts/compare-cloudflare-ai.mjs --dry-run
      - name: Run bounded real synthetic test
        env:
          BENCHMARK_MODELS: ${{ steps.choose.outputs.models }}
          BENCHMARK_FIXTURE: ${{ inputs.fixture }}
          BENCH_REPORT_DIR: ${{ runner.temp }}/sidequest-ai-benchmark
          BENCH_COMPACT: ${{ steps.pipeline.outputs.compact }}
          BENCH_FAST_PIPELINE: ${{ steps.pipeline.outputs.fast }}
          BENCH_SPLIT_STAGES: ${{ steps.pipeline.outputs.split }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node --import ./worker/test/register.mjs worker/scripts/compare-cloudflare-ai.mjs

      - name: Upload synthetic lesson and child's teaching review
        if: ${{ always() && inputs.confirm_charge == 'RUN' }}
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-lesson-teaching-review
          path: ${{ runner.temp }}/sidequest-ai-benchmark/
          if-no-files-found: warn
          retention-days: 3
