name: Deploy staging (private)
# Manual only. Deploys the current branch to a SEPARATE staging Worker and a SEPARATE staging D1 database.
# Never touches production (sidequest-db1 / the "side-quest" Worker / sidequestlearning.app).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_JWT_SECRET STAGING_KEY; do
            eval "val=\${$v:-}"; 
          done
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          [ -n "${{ secrets.STAGING_JWT_SECRET }}" ] && [ -n "${{ secrets.STAGING_KEY }}" ] || { echo "Missing STAGING_JWT_SECRET or STAGING_KEY secret"; exit 1; }
      - name: Install and build
        run: |
          npm ci
          npm --prefix worker ci
          npm --prefix frontend ci --legacy-peer-deps
          CI=false npm --prefix frontend run build
      - name: Find or create the staging database
        run: |
          set -e
          ID=$(npx wrangler d1 list --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));const x=d.find(r=>r.name==="sidequest-staging");console.log(x?x.uuid:"")')
          if [ -z "$ID" ]; then
            npx wrangler d1 create sidequest-staging
            ID=$(npx wrangler d1 list --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));const x=d.find(r=>r.name==="sidequest-staging");console.log(x?x.uuid:"")')
          fi
          [ -n "$ID" ] || { echo "could not get staging database id"; exit 1; }
          sed -i "s/REPLACED_BY_WORKFLOW/$ID/" wrangler.staging.jsonc
          grep -q '"sidequest-staging"' wrangler.staging.jsonc
          echo "staging database: $ID"
      - name: Apply migrations to the staging database
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.staging.jsonc
      - name: Deploy staging Worker
        run: npx wrangler deploy --config wrangler.staging.jsonc
      - name: Set staging secrets
        run: |
          printf '{"JWT_SECRET":"%s","STAGING_KEY":"%s"}' "${{ secrets.STAGING_JWT_SECRET }}" "${{ secrets.STAGING_KEY }}" > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json --config wrangler.staging.jsonc
          rm /tmp/secrets.json
      - name: Done
        run: |
          echo "Staging deployed. Open https://side-quest-staging.<your-workers-subdomain>.workers.dev/api/staging-access?key=<STAGING_KEY> once, then use the site." 
