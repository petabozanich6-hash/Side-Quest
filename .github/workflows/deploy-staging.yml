name: Deploy staging (private)
# Manual or dedicated staging branch only. Deploys the current branch to a SEPARATE staging Worker and a SEPARATE staging D1 database.
# Never touches production (sidequest-db1 / the "side-quest" Worker / sidequestlearning.app).
on:
  workflow_dispatch:
  push:
    branches: [staging/sidequest-modernisation]

permissions:
  contents: read

concurrency:
  group: sidequest-private-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
      STAGING_KEY: ${{ secrets.STAGING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          [ -n "$STAGING_JWT_SECRET" ] && [ -n "$STAGING_KEY" ] || { echo "Missing STAGING_JWT_SECRET or STAGING_KEY secret"; exit 1; }
      - name: Install and build
        run: |
          npm ci
          npm --prefix worker ci
          npm --prefix frontend ci --legacy-peer-deps
          CI=false npm --prefix frontend run build
      - name: Require existing isolated staging database
        run: |
          set -euo pipefail
          ID=$(npx wrangler d1 list --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));const x=d.find(r=>r.name==="sidequest-staging");console.log(x?x.uuid:"")')
          [[ "$ID" =~ ^[0-9a-fA-F-]{36}$ ]] && [ "$ID" != "d26b63e2-d9e1-4021-b9c5-c494b607aa14" ] || { echo "Existing isolated staging D1 is not available. No resources created."; exit 1; }
          sed -i "s/REPLACED_BY_WORKFLOW/$ID/" wrangler.staging.jsonc
          grep -q '"sidequest-staging"' wrangler.staging.jsonc
      - name: Optional existing staging R2 (no provisioning)
        if: vars.STAGING_ENABLE_R2 == 'yes'
        run: |
          set -euo pipefail
          npx wrangler r2 bucket list --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));if(!d.some(x=>x.name==="sidequest-staging-files")){console.error("Existing staging bucket unavailable");process.exit(1)}'
          node -e '
            const fs=require("fs");
            const t=fs.readFileSync("wrangler.staging.jsonc","utf8").split("\n").filter(l=>!l.trim().startsWith("//")).join("\n");
            const c=JSON.parse(t);
            c.r2_buckets=[{binding:"BUCKET",bucket_name:"sidequest-staging-files"}];
            fs.writeFileSync("wrangler.staging.jsonc",JSON.stringify(c,null,2));
          '
      - name: Validate isolation
        run: |
          node -e '
            const fs=require("fs");
            const c=JSON.parse(fs.readFileSync("wrangler.staging.jsonc","utf8").split("\n").filter(l=>!l.trim().startsWith("//")).join("\n"));
            if(c.name!=="side-quest-staging"||c.vars?.STAGING_PRIVATE!=="true"||c.d1_databases?.length!==1||c.d1_databases[0].database_name!=="sidequest-staging"||c.d1_databases[0].database_id==="d26b63e2-d9e1-4021-b9c5-c494b607aa14"||c.routes||c.send_email||c.ai||c.triggers||(c.r2_buckets||[]).some(b=>b.bucket_name!=="sidequest-staging-files"))throw Error("Staging isolation check failed");
          '
      - name: Apply migrations to the staging database
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.staging.jsonc
      - name: Deploy staging Worker
        run: npx wrangler deploy --config wrangler.staging.jsonc
      - name: Set staging secrets
        run: |
          set -e
          umask 077
          file=$(mktemp)
          trap 'rm -f "$file"' EXIT
          node -e 'process.stdout.write(JSON.stringify({JWT_SECRET:process.env.STAGING_JWT_SECRET,STAGING_KEY:process.env.STAGING_KEY}))' > "$file"
          npx wrangler secret bulk "$file" --config wrangler.staging.jsonc
      - name: Done
        run: |
          echo "Staging deployed. Open https://side-quest-staging.<your-workers-subdomain>.workers.dev/api/staging-access?key=<STAGING_KEY> once, then use the site." 
