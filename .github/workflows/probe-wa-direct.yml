name: Check direct WA official JSON access
# The SCSA outline HTML index returns 403 to GitHub runners.
# Check public direct official downloads before concluding WA is blocked.
on:
  pull_request:
    paths:
      - .github/workflows/probe-wa-direct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-download-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check official SCSA JSON links without storing copyrighted descriptions
        run: |
          node --input-type=module - <<'NODE'
          const urls = [
            "https://k10outline.scsa.wa.edu.au/__data/assets/file/0005/1270382/english.json",
            "https://k10outline.scsa.wa.edu.au/__data/assets/file/0011/1270379/chinese-second-language.json"
          ];
          for (const url of urls) {
            try {
              const r = await fetch(url, {headers:{accept:"application/json"},signal:AbortSignal.timeout(16000)});
              if (r.ok) {
                const data=await r.json();
                const n=Array.isArray(data)?data.length:0;
                console.log("DIRECT_WA_SOURCE: "+JSON.stringify({url,status:r.status,top_level_rows:n,accessible:true}));
              } else console.log("DIRECT_WA_SOURCE: "+JSON.stringify({url,status:r.status,accessible:false}));
            } catch(e){console.log("DIRECT_WA_SOURCE: "+JSON.stringify({url,error:String(e).slice(0,120),accessible:false}));}
          }
          NODE
