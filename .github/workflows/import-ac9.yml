name: Import and verify AC9 curriculum
# Verifies all eight learning areas from the official ACARA MRAC export on PRs.
# Manual runs publish an unmerged review branch; never deploy or overwrite data.
on:
  pull_request:
    paths:
      - worker/scripts/import-ac9.mjs
      - worker/scripts/ac9-code-level.mjs
      - worker/test/ac9CodeLevel.test.mjs
      - worker/scripts/audit-catalogue.mjs
      - worker/src/data/ac9-outcomes.ts
      - worker/test/ac9Catalogue.test.mjs
      - .github/workflows/import-ac9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download all eight ACARA v9 learning areas, including Languages
        run: node worker/scripts/import-ac9.mjs
      - name: Require real IDs from every learning area and check for duplicates
        env:
          CURRICULUM_REPORT_PATH: curriculum-coverage-report.json
        run: node worker/scripts/audit-catalogue.mjs --require-all-eight
      - name: Test the generated catalogue and language elective filtering
        run: node --experimental-strip-types --test worker/test/ac9Catalogue.test.mjs worker/test/ac9CodeLevel.test.mjs
      - name: Attach generated data and audit for review
        uses: actions/upload-artifact@v4
        with:
          name: ac9-catalogue-and-coverage
          path: |
            worker/src/data/ac9-outcomes.ts
            curriculum-coverage-report.json
          retention-days: 14
      - name: Publish a fresh unmerged review branch (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          REVIEW_BRANCH: data/ac9-import-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$REVIEW_BRANCH"
          git add worker/src/data/ac9-outcomes.ts
          if git diff --cached --quiet; then
            echo "No changes from checked-in catalogue"
            exit 0
          fi
          git commit -m "Data: all eight ACARA v9 learning areas including Languages"
          git push origin "$REVIEW_BRANCH"
          echo "Review the generated branch before merging: $REVIEW_BRANCH"
