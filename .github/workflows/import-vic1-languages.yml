name: Discover currently applicable Victorian VC1 language identifiers
# VC1 language review import already executed on the draft PR. Refresh manually,
# while the checked-in catalogue and parser tests run in the ordinary CI suite.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate all Phase 3/4 VC1 language routes and parser
        run: node --test worker/test/vic1Languages.test.mjs
      - name: Fetch official 2026-current legacy Victorian Languages
        run: node worker/scripts/import-vic1-languages.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vc1-2026-phase-3-4-languages
          path: worker/src/data/vic1-languages-review.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit source candidates on draft PR only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add worker/src/data/vic1-languages-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Data(review only): VCAA 2026 current VC1 Phase3/4 language IDs"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH" || { git rebase --abort; exit 1; }
            sleep 2
          done
          exit 1
