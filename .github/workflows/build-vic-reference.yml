name: Build source-backed Victorian code reference
on:
  pull_request:
    paths:
      - worker/scripts/build-vic-reference.mjs
      - worker/test/vicReference.test.mjs
      - .github/workflows/build-vic-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build code-only VC2 plus VC1 EAL reference data
        run: node worker/scripts/build-vic-reference.mjs
      - name: Validate code counts, distinct sources and applicable editions
        run: node --no-warnings --import ./worker/test/register.mjs --test worker/test/vicReference.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vic-source-backed-reference
          path: worker/src/data/vic-source-ids.ts
          retention-days: 30
      - name: Commit audited data to draft branch only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add worker/src/data/vic-source-ids.ts
          if git diff --cached --quiet; then
            echo "Compiled codes unchanged"
          else
            git commit -m "Data: code-only VCAA v2 and 2026-current v1 EAL source reference"
            for attempt in 1 2 3; do
              if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
              git fetch origin "$TARGET_BRANCH"
              git rebase "origin/$TARGET_BRANCH" || { git rebase --abort; exit 1; }
              sleep 2
            done
            exit 1
          fi
