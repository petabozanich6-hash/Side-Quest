name: Import official SACE and NTCET subject codes for 2026
# Official SACE subject codes were source-imported and are now on the draft branch.
# Re-fetch manually only when the SACE Board updates subject code tables;
# checked-in data and importer tests remain part of normal CI.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  authority-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test SACE Stage 1/2 subject code parser and electives
        run: node --test worker/test/sace2026.test.mjs
      - name: Import actual published SACE subject tables
        run: node worker/scripts/import-sace-2026.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sace-2026-subject-code-review
          path: worker/src/data/sace-2026-subject-review.json
          if-no-files-found: warn
          retention-days: 30
      - name: Commit official source review on draft branch only
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add worker/src/data/sace-2026-subject-review.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Data(review): source-verified SACE and NTCET subject codes and elective variants"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH" || { git rebase --abort; exit 1; }
            sleep 2
          done
          exit 1
