name: Import Tasmania 2026 senior courses (official codes only)
on:
  pull_request:
    paths:
      - worker/scripts/import-tasc-2026.mjs
      - worker/test/tasc2026.test.mjs
      - .github/workflows/import-tasc-2026.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tasc-current-course-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate official current-year course listing parser
        run: node --test worker/test/tasc2026.test.mjs
      - name: Import every listed current TASC course ID (including preliminary and electives)
        run: node worker/scripts/import-tasc-2026.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tas-2026-senior-courses
          path: worker/src/data/tasc-2026-course-codes.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit checked current-year course identifiers to unmerged branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add worker/src/data/tasc-2026-course-codes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Data: 2026 TASC official senior elective and course identifiers"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH" || { git rebase --abort; exit 1; }
            sleep 2
          done
          exit 1
